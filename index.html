<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daymark — To-do list</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f4f1;
      --surface: rgba(255, 255, 255, 0.82);
      --text: #1d1d1f;
      --muted: #77776f;
      --line: #deded7;
      --accent: #4f7d63;
      --accent-soft: #edf3ef;
      --danger: #b84d4d;
      --shadow: 0 18px 50px rgba(45, 48, 42, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171816;
        --surface: rgba(31, 32, 29, 0.86);
        --text: #f1f1ec;
        --muted: #aaa99f;
        --line: #373834;
        --accent: #91b59e;
        --accent-soft: #263229;
        --danger: #e18a8a;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(480px, calc(100% - 40px));
      margin: 0 auto;
      padding: 82px 0 48px;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      padding-bottom: 2px;
    }

    .composer {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 7px 7px 7px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .composer:focus-within {
      border-color: color-mix(in srgb, var(--accent) 60%, var(--line));
      box-shadow: 0 18px 50px rgba(45, 48, 42, 0.1), 0 0 0 3px var(--accent-soft);
    }

    input[type="text"] {
      min-width: 0;
      flex: 1;
      height: 42px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
    }

    input[type="text"]::placeholder {
      color: var(--muted);
    }

    .add-button {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--bg);
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .add-button:hover {
      filter: brightness(1.05);
    }

    .add-button:active {
      transform: scale(0.94);
    }

    .tasks {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .task {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) 32px;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 8px 10px 8px 16px;
      border-bottom: 1px solid var(--line);
      animation: enter 260ms ease both;
    }

    .task:last-child {
      border-bottom: 0;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .checkbox {
      position: relative;
      width: 20px;
      height: 20px;
      margin: 0;
      appearance: none;
      border: 1.5px solid var(--line);
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transition: border-color 180ms ease, background 180ms ease, transform 180ms cubic-bezier(.2,.8,.2,1);
    }

    .checkbox::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 2px;
      width: 6px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) scale(0);
      transition: transform 180ms cubic-bezier(.2,.8,.2,1);
    }

    .checkbox:checked {
      border-color: var(--accent);
      background: var(--accent);
      transform: scale(1.04);
    }

    .checkbox:checked::after {
      transform: rotate(45deg) scale(1);
    }

    .task-name {
      overflow-wrap: anywhere;
      transition: color 180ms ease, opacity 180ms ease;
    }

    .task.completed .task-name {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 1px;
      opacity: 0.72;
    }

    .delete-button {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      opacity: 0;
      transition: opacity 160ms ease, color 160ms ease, background 160ms ease;
    }

    .task:hover .delete-button,
    .delete-button:focus-visible {
      opacity: 1;
    }

    .delete-button:hover {
      background: color-mix(in srgb, var(--danger) 10%, transparent);
      color: var(--danger);
    }

    .empty {
      display: none;
      padding: 34px 20px;
      color: var(--muted);
      text-align: center;
    }

    .tasks.empty-visible .empty {
      display: block;
    }

    @media (max-width: 520px) {
      main {
        width: calc(100% - 32px);
        padding-top: 48px;
      }

      .delete-button {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }

    :root {
      --bg: #f5f6f8;
      --surface: #fff;
      --text: #20232a;
      --muted: #78808d;
      --line: #e8ebef;
      --accent: #5869e8;
      --accent-soft: #eef0ff;
      --danger: #cf5962;
      --shadow: 0 8px 26px rgba(37, 45, 70, .05);
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15171c;
        --surface: #1e2128;
        --text: #f2f3f6;
        --muted: #9da4b1;
        --line: #30343e;
        --accent: #9aa5ff;
        --accent-soft: #292d49;
        --danger: #f08b93;
        --shadow: 0 8px 26px rgba(0, 0, 0, .16);
        color-scheme: dark;
      }
    }

    body {
      background: var(--bg);
      font-size: 14px;
    }

    main.app-shell {
      width: min(1050px, calc(100% - 48px));
      padding: 46px 0 56px;
    }

    .topbar, .page-heading, .workspace, .content-heading, .filter-list button,
    .task-row, .task-main, .task-actions, .composer-fields, .stats {
      display: flex;
    }

    .topbar, .page-heading, .content-heading {
      align-items: center;
      justify-content: space-between;
    }

    .topbar { margin-bottom: 42px; }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.03em;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
    }

    .today-label { color: var(--muted); font-size: 13px; }
    .page-heading { align-items: flex-end; margin-bottom: 25px; }
    .page-heading h1 { font-size: 30px; letter-spacing: -.045em; }
    .page-heading p { margin: 8px 0 0; color: var(--muted); }

    .stats { gap: 14px; margin-bottom: 27px; }
    .stat-card {
      flex: 1;
      min-width: 0;
      padding: 17px 19px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { display: block; margin-top: 7px; font-size: 23px; font-weight: 700; letter-spacing: -.04em; }
    .stat-value.overdue-value { color: var(--danger); }

    .workspace { align-items: flex-start; gap: 22px; }
    .sidebar { width: 185px; flex: 0 0 185px; padding-top: 8px; }
    .side-label {
      margin: 0 0 10px 11px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .filter-list { display: grid; gap: 4px; }
    .filter-list button {
      width: 100%;
      align-items: center;
      gap: 10px;
      padding: 10px 11px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      font: inherit;
      transition: background 160ms ease, color 160ms ease;
    }
    .filter-list button:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
    .filter-list button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .filter-icon { width: 16px; text-align: center; }
    .filter-count { margin-left: auto; font-size: 12px; }
    .sidebar-rule { height: 1px; margin: 19px 0; background: var(--line); }
    .clear-completed {
      padding: 8px 11px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
    }
    .clear-completed:hover { color: var(--danger); }

    .content { min-width: 0; flex: 1; }
    .content-heading { margin: 2px 0 17px; }
    .content-heading h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .content-heading small { color: var(--muted); }

    .composer {
      display: block;
      margin-bottom: 13px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .composer input, .composer select, .search-input, .sort-select {
      height: 37px;
      border: 0;
      border-radius: 8px;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
    }
    .composer input:focus, .composer select:focus, .search-input:focus, .sort-select:focus {
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .composer input[type="text"] { width: 100%; padding: 0 10px; }
    .composer-fields { gap: 8px; padding: 4px 3px 2px; }
    .composer select {
      min-width: 0;
      padding: 0 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      font-size: 12px;
    }
    .composer input[type="date"] {
      width: 142px;
      padding: 0 7px;
      border: 1px solid var(--line);
      background: var(--bg);
      font-size: 12px;
    }
    .add-button {
      width: auto;
      height: 37px;
      flex: 0 0 auto;
      padding: 0 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .search-tools { display: flex; gap: 8px; }
    .search-input, .sort-select {
      padding: 0 11px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 12px;
    }
    .search-input { width: 175px; }
    .sort-select { max-width: 145px; }

    .tasks { border-radius: 13px; }
    .task {
      display: block;
      min-height: 0;
      padding: 0;
      border-bottom: 1px solid var(--line);
      animation: enter 220ms ease both;
    }
    .task-row { align-items: center; gap: 12px; min-height: 69px; padding: 11px 14px; }
    .task-main { min-width: 0; flex: 1; align-items: center; gap: 11px; }
    .task-info { min-width: 0; }
    .task-name { display: block; font-size: 13px; font-weight: 550; }
    .task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 6px; }
    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 11px;
    }
    .meta-chip.overdue { color: var(--danger); }
    .category-chip { padding: 3px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 10px; }
    .priority-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
    .priority-high .priority-dot { background: #e06b69; }
    .priority-medium .priority-dot { background: #e5a84b; }
    .priority-low .priority-dot { background: #62a77d; }
    .task.completed .task-name { opacity: .58; }
    .task-actions { gap: 3px; }
    .task-actions button {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      opacity: .5;
    }
    .task-row:hover .task-actions button, .task-actions button:focus-visible { opacity: 1; }
    .task-actions button:hover { background: var(--accent-soft); color: var(--accent); }
    .task-actions .delete-button:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); }
    .empty { padding: 38px 20px; font-size: 13px; }
    .dialog {
      width: min(420px, calc(100% - 28px));
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 24px 80px rgba(0,0,0,.2);
    }
    .dialog::backdrop { background: rgba(15, 18, 25, .48); backdrop-filter: blur(3px); }
    .dialog-form { display: grid; gap: 13px; padding: 22px; }
    .dialog-form h2 { margin: 0 0 3px; font-size: 18px; }
    .dialog-form label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
    .dialog-form input, .dialog-form select {
      height: 39px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .dialog-actions button { padding: 9px 13px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--text); cursor: pointer; font: inherit; }
    .dialog-actions button[type="submit"] { border-color: var(--accent); background: var(--accent); color: white; }

    @media (max-width: 700px) {
      main.app-shell { width: min(520px, calc(100% - 32px)); padding-top: 30px; }
      .topbar { margin-bottom: 30px; }
      .stats { gap: 8px; }
      .stat-card { padding: 13px; }
      .workspace { display: block; }
      .sidebar { width: auto; margin-bottom: 18px; padding: 0; }
      .side-label, .sidebar-rule, .clear-completed { display: none; }
      .filter-list { display: flex; overflow-x: auto; gap: 6px; }
      .filter-list button { width: auto; flex: 0 0 auto; padding: 9px 11px; }
      .filter-count { margin-left: 0; }
      .task-actions button { opacity: 1; }
    }
    @media (max-width: 440px) {
      .page-heading { align-items: flex-start; gap: 12px; }
      .page-heading h1 { font-size: 26px; }
      .today-label { max-width: 110px; text-align: right; line-height: 1.4; }
      .stat-card { padding: 11px 9px; }
      .stat-value { font-size: 19px; }
      .composer-fields { flex-wrap: wrap; }
      .composer select { flex: 1; }
      .composer input[type="date"] { flex: 1; }
      .search-tools { width: 100%; }
      .content-heading { flex-wrap: wrap; gap: 10px; }
      .search-input { min-width: 0; flex: 1; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✓</span> Daymark</div>
      <div class="today-label" id="today-label"></div>
    </header>

    <section class="page-heading">
      <div>
        <h1>Your space</h1>
        <p>A little progress, every day.</p>
      </div>
    </section>

    <section class="stats" aria-label="Task overview">
      <article class="stat-card"><span class="stat-label">To do</span><strong class="stat-value" id="stat-open">0</strong></article>
      <article class="stat-card"><span class="stat-label">Completed</span><strong class="stat-value" id="stat-done">0</strong></article>
      <article class="stat-card"><span class="stat-label">Overdue</span><strong class="stat-value overdue-value" id="stat-overdue">0</strong></article>
    </section>

    <section class="workspace">
      <aside class="sidebar" aria-label="Task filters">
        <p class="side-label">Workspace</p>
        <nav class="filter-list" id="filters">
          <button type="button" class="active" data-filter="all"><span class="filter-icon">▦</span> All tasks <span class="filter-count" id="filter-all"></span></button>
          <button type="button" data-filter="today"><span class="filter-icon">◷</span> Due today <span class="filter-count" id="filter-today"></span></button>
          <button type="button" data-filter="upcoming"><span class="filter-icon">↗</span> Upcoming <span class="filter-count" id="filter-upcoming"></span></button>
          <button type="button" data-filter="completed"><span class="filter-icon">✓</span> Completed <span class="filter-count" id="filter-completed"></span></button>
        </nav>
        <div class="sidebar-rule"></div>
        <button class="clear-completed" id="clear-completed" type="button">Clear completed</button>
      </aside>

      <section class="content">
        <div class="content-heading">
          <div>
            <h2 id="list-title">All tasks</h2>
            <small id="list-subtitle"></small>
          </div>
          <div class="search-tools">
            <input id="search" class="search-input" type="search" placeholder="Search tasks..." aria-label="Search tasks">
            <select id="sort" class="sort-select" aria-label="Sort tasks">
              <option value="created">Recently added</option>
              <option value="due">Due date</option>
              <option value="priority">Priority</option>
            </select>
          </div>
        </div>

        <form class="composer" id="composer">
          <input id="task-input" type="text" placeholder="What needs to get done?" autocomplete="off" aria-label="New task" maxlength="160" required>
          <div class="composer-fields">
            <input id="task-due" type="date" aria-label="Due date">
            <select id="task-priority" aria-label="Priority">
              <option value="medium">Medium priority</option>
              <option value="high">High priority</option>
              <option value="low">Low priority</option>
            </select>
            <select id="task-category" aria-label="Category">
              <option>Personal</option>
              <option>Work</option>
              <option>Health</option>
              <option>Learning</option>
            </select>
            <button class="add-button" type="submit">Add task</button>
          </div>
        </form>

        <div class="tasks" id="tasks" aria-live="polite">
          <div class="empty" id="empty">No tasks here. Enjoy the breathing room.</div>
        </div>
      </section>
    </section>
  </main>

  <dialog class="dialog" id="edit-dialog">
    <form class="dialog-form" id="edit-form">
      <h2>Edit task</h2>
      <label>Task name<input id="edit-title" type="text" maxlength="160" required></label>
      <label>Due date<input id="edit-due" type="date"></label>
      <label>Priority
        <select id="edit-priority">
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </label>
      <label>Category
        <select id="edit-category">
          <option>Personal</option><option>Work</option><option>Health</option><option>Learning</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button type="button" id="cancel-edit">Cancel</button>
        <button type="submit">Save changes</button>
      </div>
    </form>
  </dialog>

  <script>
    const STORAGE_KEY = "polished-todo-tasks";
    const defaultTasks = [
      { id: "example-1", text: "Review the week ahead", completed: false, due: "", priority: "high", category: "Work", createdAt: 1 },
      { id: "example-2", text: "Take a walk outside", completed: true, due: "", priority: "low", category: "Health", createdAt: 2 },
      { id: "example-3", text: "Make time for something creative", completed: false, due: "", priority: "medium", category: "Personal", createdAt: 3 }
    ];

    let tasks = loadTasks();
    const taskInput = document.getElementById("task-input");
    const composer = document.getElementById("composer");
    const taskList = document.getElementById("tasks");
    const emptyState = document.getElementById("empty");
    const filterButtons = [...document.querySelectorAll("[data-filter]")];
    const editDialog = document.getElementById("edit-dialog");
    let activeFilter = "all";
    let editingTaskId = null;
    let createdSequence = Date.now();

    function loadTasks() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved !== null) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) {
            return parsed.filter(task => task && typeof task.text === "string").map((task, index) => ({
              id: String(task.id || `saved-${index}-${Date.now()}`),
              text: task.text,
              completed: Boolean(task.completed),
              due: typeof task.due === "string" ? task.due : "",
              priority: ["high", "medium", "low"].includes(task.priority) ? task.priority : "medium",
              category: ["Personal", "Work", "Health", "Learning"].includes(task.category) ? task.category : "Personal",
              createdAt: Number.isFinite(task.createdAt) ? task.createdAt : index
            }));
          }
        } catch (error) {
          console.error("Could not read saved tasks:", error);
        }
      }
      return defaultTasks.map(task => ({ ...task }));
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function dateKey(date = new Date()) {
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    function taskIsOverdue(task) {
      return !task.completed && task.due && task.due < dateKey();
    }

    function filteredTasks() {
      const query = document.getElementById("search").value.trim().toLowerCase();
      const today = dateKey();
      const result = tasks.filter(task => {
        const matchesFilter = activeFilter === "all" ||
          (activeFilter === "today" && !task.completed && task.due === today) ||
          (activeFilter === "upcoming" && !task.completed && task.due > today) ||
          (activeFilter === "completed" && task.completed);
        return matchesFilter && (!query || `${task.text} ${task.category} ${task.priority}`.toLowerCase().includes(query));
      });

      const sort = document.getElementById("sort").value;
      const priorityOrder = { high: 0, medium: 1, low: 2 };
      result.sort((a, b) => {
        if (sort === "due") return (a.due || "9999-12-31").localeCompare(b.due || "9999-12-31") || b.createdAt - a.createdAt;
        if (sort === "priority") return priorityOrder[a.priority] - priorityOrder[b.priority] || b.createdAt - a.createdAt;
        return b.createdAt - a.createdAt;
      });
      return result;
    }

    function formatDueDate(value) {
      if (!value) return "No due date";
      const date = new Date(`${value}T00:00:00`);
      if (value === dateKey()) return "Due today";
      return date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    function createTaskElement(task) {
      const row = document.createElement("article");
      row.className = `task${task.completed ? " completed" : ""}`;

      const taskRow = document.createElement("div");
      taskRow.className = "task-row";
      const taskMain = document.createElement("div");
      taskMain.className = "task-main";

        const checkbox = document.createElement("input");
        checkbox.className = "checkbox";
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", `Mark "${task.text}" as ${task.completed ? "not complete" : "complete"}`);

        const taskInfo = document.createElement("div");
        taskInfo.className = "task-info";
        const name = document.createElement("span");
        name.className = "task-name";
        name.textContent = task.text;

        const meta = document.createElement("div");
        meta.className = "task-meta";
        const due = document.createElement("span");
        due.className = `meta-chip${taskIsOverdue(task) ? " overdue" : ""}`;
        due.textContent = `${taskIsOverdue(task) ? "!" : "◷"} ${formatDueDate(task.due)}`;
        const priority = document.createElement("span");
        priority.className = `meta-chip priority-${task.priority}`;
        const dot = document.createElement("span");
        dot.className = "priority-dot";
        priority.append(dot, `${task.priority[0].toUpperCase()}${task.priority.slice(1)}`);
        const category = document.createElement("span");
        category.className = "category-chip";
        category.textContent = task.category;
        meta.append(due, priority, category);
        taskInfo.append(name, meta);
        taskMain.append(checkbox, taskInfo);

        const actions = document.createElement("div");
        actions.className = "task-actions";
        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.setAttribute("aria-label", `Edit "${task.text}"`);
        editButton.title = "Edit task";
        editButton.textContent = "✎";
        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "×";
        deleteButton.setAttribute("aria-label", `Delete "${task.text}"`);

        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          checkbox.setAttribute("aria-label", `Mark "${task.text}" as ${task.completed ? "not complete" : "complete"}`);
          saveTasks();
          render();
        });

        editButton.addEventListener("click", () => openEditDialog(task));

        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          render();
        });

        actions.append(editButton, deleteButton);
        taskRow.append(taskMain, actions);
        row.append(taskRow);

      return row;
    }

    function renderStats() {
      const open = tasks.filter(task => !task.completed);
      const completed = tasks.filter(task => task.completed);
      document.getElementById("stat-open").textContent = open.length;
      document.getElementById("stat-done").textContent = completed.length;
      document.getElementById("stat-overdue").textContent = open.filter(taskIsOverdue).length;
      document.getElementById("filter-all").textContent = tasks.length;
      document.getElementById("filter-today").textContent = open.filter(task => task.due === dateKey()).length;
      document.getElementById("filter-upcoming").textContent = open.filter(task => task.due > dateKey()).length;
      document.getElementById("filter-completed").textContent = completed.length;
    }

    function render() {
      taskList.querySelectorAll(".task").forEach(task => task.remove());
      const visibleTasks = filteredTasks();
      emptyState.textContent = visibleTasks.length ? "No matching tasks. Try a different search." : "No tasks here. Enjoy the breathing room.";
      taskList.classList.toggle("empty-visible", visibleTasks.length === 0);
      visibleTasks.forEach(task => taskList.insertBefore(createTaskElement(task), emptyState));
      const titles = { all: "All tasks", today: "Due today", upcoming: "Upcoming", completed: "Completed" };
      document.getElementById("list-title").textContent = titles[activeFilter];
      document.getElementById("list-subtitle").textContent = `${visibleTasks.length} ${visibleTasks.length === 1 ? "task" : "tasks"}`;
      renderStats();
    }

    function openEditDialog(task) {
      editingTaskId = task.id;
      document.getElementById("edit-title").value = task.text;
      document.getElementById("edit-due").value = task.due;
      document.getElementById("edit-priority").value = task.priority;
      document.getElementById("edit-category").value = task.category;
      editDialog.showModal();
      document.getElementById("edit-title").focus();
    }

    composer.addEventListener("submit", event => {
      event.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;

      tasks.push({
        id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
        text,
        completed: false,
        due: document.getElementById("task-due").value,
        priority: document.getElementById("task-priority").value,
        category: document.getElementById("task-category").value,
        createdAt: ++createdSequence
      });
      taskInput.value = "";
      document.getElementById("task-due").value = "";
      saveTasks();
      render();
    });

    document.getElementById("filters").addEventListener("click", event => {
      const button = event.target.closest("[data-filter]");
      if (!button) return;
      activeFilter = button.dataset.filter;
      filterButtons.forEach(item => item.classList.toggle("active", item === button));
      render();
    });

    document.getElementById("search").addEventListener("input", render);
    document.getElementById("sort").addEventListener("change", render);
    document.getElementById("clear-completed").addEventListener("click", () => {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      render();
    });

    document.getElementById("cancel-edit").addEventListener("click", () => editDialog.close());
    document.getElementById("edit-form").addEventListener("submit", event => {
      event.preventDefault();
      const task = tasks.find(item => item.id === editingTaskId);
      if (!task) return;
      task.text = document.getElementById("edit-title").value.trim();
      task.due = document.getElementById("edit-due").value;
      task.priority = document.getElementById("edit-priority").value;
      task.category = document.getElementById("edit-category").value;
      saveTasks();
      editDialog.close();
      render();
    });

    document.getElementById("today-label").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    render();
  </script>
</body>
</html>
